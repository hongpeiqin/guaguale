<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05030d" />
  <meta name="description" content="沿莫比乌斯带无限循环的 3D 粒子轨迹，基于 Three.js。" />
  <title>莫比乌斯粒子环</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/hongpeiqin/guaguale@841962d3de8a9283eea49eb1fb3ce029f6de593d/mobius-particle-demo/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main id="app" aria-label="莫比乌斯粒子环 3D 动画">
    <canvas id="scene" aria-label="3D 粒子动画画布"></canvas>

    <section class="hero" aria-hidden="true">
      <div class="eyebrow"><span></span> ONE-SIDED FLOW</div>
      <h1>莫比乌斯<br /><strong>粒子环</strong></h1>
      <p>粒子沿单侧曲面闭环穿行。拖拽旋转，滚轮缩放。</p>
    </section>

    <section class="panel" aria-label="动画控制">
      <div class="panel__status">
        <span class="status-dot"></span>
        <span id="statusText">无限循环中</span>
      </div>

      <label class="range-row" for="speed">
        <span>流速</span>
        <input id="speed" type="range" min="0.15" max="2.2" value="1" step="0.05" />
        <output id="speedValue" for="speed">1.00×</output>
      </label>

      <label class="range-row" for="bloom">
        <span>辉光</span>
        <input id="bloom" type="range" min="0" max="2" value="1.15" step="0.05" />
        <output id="bloomValue" for="bloom">1.15</output>
      </label>

      <div class="button-row">
        <button id="toggleMotion" type="button">暂停</button>
        <button id="resetCamera" type="button">复位视角</button>
      </div>
    </section>

    <div class="corner-note" aria-hidden="true">
      <span>∞</span>
      <div>2π PARAMETRIC LOOP<br />GPU PARTICLE FIELD</div>
    </div>

    <div id="fallback" class="fallback" hidden>
      <h2>浏览器没能启动 WebGL</h2>
      <p>请换用支持 WebGL2 的现代浏览器，并确认硬件加速已开启。</p>
    </div>
  </main>

  <script type="module" src="https://cdn.jsdelivr.net/gh/hongpeiqin/guaguale@841962d3de8a9283eea49eb1fb3ce029f6de593d/mobius-particle-demo/src/main.js"></script>
</body>
</html>
